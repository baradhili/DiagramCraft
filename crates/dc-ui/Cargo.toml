[package]
name = "dc-ui"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Tarahi desktop application (Visio-compatible diagram editor)"

# Distribution name for the GUI binary (packaging + desktop entry).
[[bin]]
name = "tarahi"
path = "src/main.rs"

[package.metadata.deb]
name = "tarahi"
# Rename transition (CodeRabbit PR #277): the package was
# `diagramcraft`, and it already shipped packaging/tarahi.desktop
# (the desktop entry was renamed ahead of the package) — so the two
# packages SHARE usr/share/applications/tarahi.desktop. Replaces
# licenses the file takeover on upgrade; Breaks moves the old
# package out. Conflicts is unnecessary (nothing else collides).
replaces = ["diagramcraft"]
breaks = ["diagramcraft"]
maintainer = "Tarahi contributors"
depends = "$auto"
section = "graphics"
priority = "optional"
extended-description = """Native Linux diagram editor for Visio files: read, render, edit and
write .vsdx/.vstx/.vssx packages losslessly, with a Visio-style ribbon
GUI, stencils and ShapeSheet inspector."""
assets = [
    ["target/release/tarahi", "usr/bin/", "755"],
    ["../../packaging/tarahi.desktop", "usr/share/applications/", "644"],
    ["../../packaging/tarahi.png", "usr/share/icons/hicolor/512x512/apps/tarahi.png", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/tarahi/LICENSE-MIT", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/tarahi/LICENSE-APACHE", "644"],
    ["../../crates/dc/assets/fonts/LICENSE-Carlito", "usr/share/doc/tarahi/LICENSE-Carlito", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "../../target/release/tarahi", dest = "/usr/bin/tarahi", mode = "755" },
    { source = "../../packaging/tarahi.desktop", dest = "/usr/share/applications/tarahi.desktop", mode = "644" },
    { source = "../../packaging/tarahi.png", dest = "/usr/share/icons/hicolor/512x512/apps/tarahi.png", mode = "644" },
    { source = "../../LICENSE-MIT", dest = "/usr/share/licenses/tarahi/LICENSE-MIT", mode = "644" },
    { source = "../../LICENSE-APACHE", dest = "/usr/share/licenses/tarahi/LICENSE-APACHE", mode = "644" },
    { source = "../../crates/dc/assets/fonts/LICENSE-Carlito", dest = "/usr/share/licenses/tarahi/LICENSE-Carlito", mode = "644" },
]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
craft-ui = { path = "../../third_party/craft-ui" }
anyhow.workspace = true
dc = { version = "0.1.0", path = "../dc" }
dc-core = { version = "0.1.0", path = "../dc-core" }
eframe = "0.37.0"
egui = "0.37"
resvg = "0.50.0"
serde_json = "1"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
# OS clipboard image paste (#113): the same arboard eframe already
# carries (same version as Cargo.lock's).
arboard = "3.7"
vsdx = { version = "0.1.0", path = "../vsdx" }
# Digest-verified built-in extraction to My Shapes (#104).
sha2 = "0.11"
# #246 i18n: typed Fluent accessors generated from the project-level
# `locales/` catalogs (see build.rs; the generated src/l10n.rs is committed).
fluent-typed = "0.10"

[build-dependencies]
fluent-typed = { version = "0.10", features = ["build"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
regex = "1" 
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
