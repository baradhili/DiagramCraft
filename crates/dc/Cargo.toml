[package]
name = "dc"
description = "Tarahi CLI — inspect and render Visio VSDX diagrams"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vsdx = { path = "../vsdx" }
dc-core = { path = "../dc-core" }
anyhow.workspace = true
clap.workspace = true
fontdb = "0.24"
ttf-parser = "0.25"
# Shaped measurement (#146): the SAME shaper version the in-tree
# usvg rasterizes with (matching lock entries), so the wrap decision
# and the raster shape identically by construction. Lockstep rule
# (#270): harfrust 0.15 is usvg 0.50's shaper; it moves ONLY when the
# in-tree usvg's own dependency does — never via a standalone bump
# (Renovate's harfrust-only PRs are superseded until then).
harfrust = "0.15"
unicode-bidi = "0.3"
# The shared SVG raster stack (#35): the same resvg 0.50 the GUI's
# svgimg canvas half uses (matching lock entries), so PNG exports are
# the canvas picture.
resvg = "0.50.0"
# PDF export (#35): vector writer (shapes as paths, text as real
# embedded Type0 fonts with ToUnicode — selectable, copyable).
pdf-writer = "0.15"
# Media XObjects: corpus picture shapes decode to raw RGB(A) for the
# PDF image stream (JPEG can also embed DCT-direct).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Content/image stream compression.
flate2 = "1"

[dev-dependencies]
tempfile = "3"
