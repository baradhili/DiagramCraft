[package]
name = "dc"
description = "DiagramCraft CLI — inspect and render Visio VSDX diagrams"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vsdx = { path = "../vsdx" }
dc-core = { path = "../dc-core" }
anyhow.workspace = true
clap.workspace = true
fontdb = "0.24"
ttf-parser = "0.25"
# Shaped measurement (#146): the SAME crates usvg 0.49 rasterizes
# with (matching lock entries), so the wrap decision and the raster
# shape identically by construction.
harfrust = "0.15"
unicode-bidi = "0.3"

[dev-dependencies]
tempfile = "3"
