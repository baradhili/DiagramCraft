[workspace]
resolver = "2"
members = ["crates/vsdx", "crates/dc", "crates/dc-ui"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
clap = { version = "4", features = ["derive"] }
