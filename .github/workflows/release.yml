name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Build release binary
        run: cargo build --release -p dc-ui --locked
      - name: Version
        id: ver
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in [0-9]*) ;; *) VER="0.1.0" ;; esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: deb
        run: cargo deb -p dc-ui --no-build
      - name: rpm
        working-directory: crates/dc-ui
        run: |
          cargo generate-rpm
          mv target/generate-rpm/*.rpm "${GITHUB_WORKSPACE}/diagramcraft_${{ steps.ver.outputs.version }}_amd64.rpm"
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109-1/linuxdeploy-x86_64.AppImage -O /tmp/linuxdeploy
          chmod +x /tmp/linuxdeploy
          OUTPUT="diagramcraft_${{ steps.ver.outputs.version }}_x86_64.AppImage" /tmp/linuxdeploy \
            --appdir AppDir \
            -e target/release/diagramcraft \
            -d packaging/diagramcraft.desktop \
            -i packaging/diagramcraft.png \
            --output appimage
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp diagramcraft_*_amd64.rpm dist/
          cp diagramcraft_*.AppImage dist/
          ls -la dist/
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install NSIS
        run: choco install nsis -y
      - name: Version
        id: ver
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in [0-9]*) ;; *) VER="0.1.0" ;; esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Build binary
        run: cargo build --release -p dc-ui --locked
      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\NSIS\makensis.exe" -DVERSION=${{ steps.ver.outputs.version }} -DBINDIR="%GITHUB_WORKSPACE%\target\release" -DLICENSEDIR="%GITHUB_WORKSPACE%" packaging\installer.nsi
      - name: Portable zip
        shell: bash
        run: |
          mkdir -p dist
          7z a -tzip "dist/diagramcraft_${{ steps.ver.outputs.version }}_windows_x64.zip" ./target/release/diagramcraft.exe
      - name: Collect artifacts
        shell: bash
        run: |
          # NSIS writes OutFile relative to the script directory.
          cp packaging/diagramcraft_*_setup.exe dist/
          ls -la dist/
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: ver
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in [0-9]*) ;; *) VER="0.1.0" ;; esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Build universal binary
        run: |
          cargo build --release -p dc-ui --locked --target x86_64-apple-darwin
          cargo build --release -p dc-ui --locked --target aarch64-apple-darwin
          mkdir -p "DiagramCraft.app/Contents/MacOS" "DiagramCraft.app/Contents/Resources"
          lipo -create \
            target/x86_64-apple-darwin/release/diagramcraft \
            target/aarch64-apple-darwin/release/diagramcraft \
            -output "DiagramCraft.app/Contents/MacOS/DiagramCraft"
      - name: Bundle icon
        run: |
          mkdir AppIcon.iconset
          for size in 16 32 128 256; do
            sips -z $size $size packaging/diagramcraft.png --out AppIcon.iconset/icon_${size}x${size}.png >/dev/null
            big=$((size * 2))
            sips -z $big $big packaging/diagramcraft.png --out AppIcon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "DiagramCraft.app/Contents/Resources/AppIcon.icns"
      - name: Bundle app + dmg
        run: |
          cp packaging/Info.plist "DiagramCraft.app/Contents/Info.plist"
          mkdir -p "DiagramCraft.app/Contents/Resources/licenses"
          cp LICENSE-MIT LICENSE-APACHE "DiagramCraft.app/Contents/Resources/licenses/"
          cp crates/dc-ui/assets/fonts/LICENSE-Carlito "DiagramCraft.app/Contents/Resources/licenses/"
          codesign --force --sign - --deep "DiagramCraft.app"
          mkdir -p dist
          hdiutil create -volname "DiagramCraft" \
            -srcfolder "DiagramCraft.app" -ov -format UDZO \
            "dist/diagramcraft_${{ steps.ver.outputs.version }}_universal.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Prerelease?
        id: pre
        run: |
          # vMAJOR.MINOR.PATCH.<letter> tags (v0.1.0.a, v0.1.0.b, …) are
          # CI-iteration prereleases; plain semver tags publish full
          # releases.
          case "$GITHUB_REF_NAME" in
            v*.*.*.*) echo "pre=true" >> "$GITHUB_OUTPUT" ;;
            *)        echo "pre=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.pre.outputs.pre }}
