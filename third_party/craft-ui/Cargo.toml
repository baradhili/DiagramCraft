[package]
name = "craft-ui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/storytold/craft-libs"
description = "Reusable egui controls and icon catalogs for Craft frontends"

# Vendored from storytold/craft-libs @ 88d245f (branch
# egui-0.37-diagramcraft) — the fork that bumps egui to 0.37. Upstream
# tracked 0.36 at adoption time; see third_party/README.md.

[dependencies]
egui = "0.37"
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
egui = { version = "0.37", features = ["default_fonts"] }
serde_json = "1"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
egui_kittest = { version = "0.37", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
